<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All In One</title>
<style>
body{margin:0;font-family:Arial;background:#f5f6fa;color:#222}header{background:#2563eb;color:#fff;text-align:center;padding:28px 15px}main{max-width:1050px;margin:auto;padding:18px}.box,.card{background:#fff;border-radius:15px;padding:18px;margin-bottom:18px;box-shadow:0 3px 15px #0001}.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}.cats{display:flex;gap:8px;overflow:auto;padding:12px 0}.cat{white-space:nowrap;border:0;border-radius:20px;padding:10px 14px;background:#e8eefc;color:#2563eb;font-weight:bold}.active{background:#2563eb;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{padding:0;overflow:hidden}.pic{height:190px;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:80px}.info{padding:16px}.price{font-size:22px;font-weight:bold;color:#2563eb;margin:10px 0}button.order,.wa{border:0;border-radius:9px;padding:12px;background:#16a34a;color:#fff;font-weight:bold;width:100%}.wa{background:#25d366;width:auto}.modal{display:none;position:fixed;inset:0;background:#0008;padding:20px}.modal>div{background:#fff;max-width:480px;margin:30px auto;padding:20px;border-radius:15px}.modal input,.modal textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.submit{background:#25d366;color:#fff;border:0;padding:12px;width:100%;border-radius:9px;font-weight:bold}
</style></head><body>
<header><h1>🛍️ All In One</h1><p>সব ধরনের পণ্য — এক জায়গায়</p></header>
<main><div class="box"><h2>Category অনুযায়ী পণ্য</h2><input class="search" id="search" placeholder="🔎 Product search করুন" oninput="show()"><div class="cats" id="cats"></div></div><div class="grid" id="products"></div>
<div class="box" style="text-align:center"><h3>📱 WhatsApp</h3><button class="wa" onclick="contact()">WhatsApp করুন</button></div></main>
<div class="modal" id="modal"><div><button onclick="closeM()">✕</button><h2>🛒 Order</h2><p id="sel"></p><b>নাম</b><input id="name"><b>মোবাইল</b><input id="phone" type="tel"><b>ঠিকানা</b><textarea id="address" rows="3"></textarea><button class="submit" onclick="order()">WhatsApp-এ Order পাঠান</button></div></div>
<script>
const wa="8801862466032", cats=["All","Electronics","Fashion","Home & Living","Beauty","Kids","Accessories"];
const p=[
["Premium Smart Watch",1490,"Electronics","⌚","স্টাইলিশ স্মার্ট ওয়াচ"],["Classic T-Shirt",650,"Fashion","👕","আরামদায়ক টি-শার্ট"],["Home Organizer",450,"Home & Living","🏠","ঘর গুছানোর পণ্য"],["Beauty Care Set",790,"Beauty","💄","বিউটি কেয়ার সেট"],["Kids Toy",550,"Kids","🧸","শিশুদের খেলনা"],["Fashion Accessories",390,"Accessories","🎒","স্টাইলিশ accessories"]];
let cat="All",selected;
function drawCats(){document.getElementById("cats").innerHTML=cats.map(x=>'<button class="cat '+(x==cat?'active':'')+'" onclick="cat=''+x+'';drawCats();show()">'+(x=="All"?"🛍️":x=="Electronics"?"📱":x=="Fashion"?"👕":x=="Home & Living"?"🏠":x=="Beauty"?"💄":x=="Kids"?"🧸":"🎒")+' '+x+'</button>').join("")}
function show(){let q=document.getElementById("search").value.toLowerCase();document.getElementById("products").innerHTML=p.filter(x=>(cat=="All"||x[2]==cat)&&x[0].toLowerCase().includes(q)).map((x,i)=>'<article class="card"><div class="pic">'+x[3]+'</div><div class="info"><small>'+x[2]+'</small><h3>'+x[0]+'</h3><p>'+x[4]+'</p><div class="price">৳'+x[1].toLocaleString()+'</div><button class="order" onclick="openM('+i+')">🛒 Order Now</button></div></article>').join("")}
function openM(i){selected=p[i];document.getElementById("sel").innerHTML="<b>"+selected[0]+" — ৳"+selected[1]+"</b>";document.getElementById("modal").style.display="block"}
function closeM(){document.getElementById("modal").style.display="none"}
function order(){let n=name.value.trim(),ph=phone.value.trim(),a=address.value.trim();if(!n||!ph||!a){alert("নাম, মোবাইল ও ঠিকানা পূরণ করুন");return}let m="🛍️ All In One Order%0A%0AProduct: "+encodeURIComponent(selected[0])+"%0APrice: ৳"+selected[1]+"%0ACategory: "+encodeURIComponent(selected[2])+"%0AName: "+encodeURIComponent(n)+"%0APhone: "+encodeURIComponent(ph)+"%0AAddress: "+encodeURIComponent(a)+"%0APayment: Cash on Delivery";location.href="https://wa.me/"+wa+"?text="+m}
function contact(){location.href="https://wa.me/"+wa+"?text="+encodeURIComponent("All In One সম্পর্কে জানতে চাই।")}drawCats();show();
</script></body></html>
